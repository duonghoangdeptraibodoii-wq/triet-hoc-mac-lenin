<body>

<div class="quiz-container">
    <h1>ÔN LUYỆN TRIẾT HỌC MÁC - LÊNIN</h1>
    <div class="subtitle">Trắc nghiệm đảo câu hỏi & đảo đáp án tự động</div>

    <div class="filter-section">

<script>
    const rawQuestions = [
        // CHƯƠNG 1 (35 câu)
        { ch: 1, question: "Theo quan điểm của triết học Hy Lạp cổ đại, \"triết học\" là gì?", options: ["Yêu mến sự thông thái.", "Tình yêu cuộc sống.", "Yêu quý thiên nhiên.", "Tình yêu thần thánh."], correctText: "Yêu mến sự thông thái." },
        { ch: 1, question: "Nguồn gốc ra đời của triết học là:", options: ["Nguồn gốc tự nhiên và xã hội.", "Nguồn gốc kinh tế - xã hội.", "Nguồn gốc nhận thức và tự nhiên.", "Nguồn gốc nhận thức và xã hội."], correctText: "Nguồn gốc nhận thức và xã hội." },
        { ch: 1, question: "Thuyết nào sau đây thừa nhận hai bản nguyên vật chất và tinh thần song song tồn tại?", options: ["Học thuyết nhất nguyên.", "Học thuyết nhị nguyên.", "Học thuyết đa nguyên.", "Học thuyết hư vô."], correctText: "Học thuyết nhị nguyên." },
        { ch: 1, question: "Triết học kinh viện thuộc về hệ thống triết học nào sau đây?", options: ["Triết học Hy Lạp cổ đại.", "Triết học Trung Quốc cổ đại.", "Triết học Tây Âu trung cổ.", "Triết học Tây Âu cận đại."], correctText: "Triết học Tây Âu trung cổ." },
        { ch: 1, question: "Triết học phương Tây ra đời ở thời kỳ nào?", options: ["Công xã nguyên thuỷ.", "Chiếm hữu nô lệ.", "Phong kiến.", "Tư bản chủ nghĩa."], correctText: "Chiếm hữu nô lệ." },
        { ch: 1, question: "Triết học ra đời trong điều kiện nào?", options: ["Xã hội phân chia thành giai cấp.", "Xuất hiện tầng lớp lao động trí óc.", "Tư duy của con người đạt đến trình độ tư duy khái quát cao và xuất hiện tầng lớp lao động trí óc.", "Xuất hiện giai cấp tư sản."], correctText: "Tư duy của con người đạt đến trình độ tư duy khái quát cao và xuất hiện tầng lớp lao động trí óc." },
        { ch: 1, question: "Những nhà triết học nào xem thường kinh nghiệm, xa rời cuộc sống?", options: ["Chủ nghĩa kinh nghiệm.", "Chủ nghĩa duy vật biện chứng.", "Chủ nghĩa kinh viện.", "Chủ nghĩa duy vật siêu hình."], correctText: "Chủ nghĩa kinh viện." },
        { ch: 1, question: "C.Mác chỉ ra đâu là hạt nhân hợp lý trong triết học của Hêghen?", options: ["Quan điểm siêu hình.", "Tư tưởng về vận động.", "Phép biện chứng như lý luận về sự phát triển.", "Quan điểm duy vật."], correctText: "Phép biện chứng như lý luận về sự phát triển." },
        { ch: 1, question: "Vấn đề cơ bản của triết học là:", options: ["Vấn đề vật chất và ý thức.", "Vấn đề mối quan hệ giữa tư duy và tồn tại.", "Vấn đề quan hệ giữa con người với thế giới xung quanh.", "Vấn đề quan hệ giữa con người với con người trong xã hội."], correctText: "Vấn đề mối quan hệ giữa tư duy và tồn tại." },
        { ch: 1, question: "Mặt thứ nhất của vấn đề cơ bản của triết học trả lời cho câu hỏi:", options: ["Con người có khả năng nhận thức thế giới hay không?", "Giữa vật chất và ý thức, cái nào có trước, cái nào có sau, cái nào quyết định cái nào?", "Vấn đề quan hệ giữa vật chất và ý thức như thế nào?", "Vấn đề quan hệ giữa tư duy và tồn tại như thế nào?"], correctText: "Giữa vật chất và ý thức, cái nào có trước, cái nào có sau, cái nào quyết định cái nào?" },
        { ch: 1, question: "Mặt thứ hai của vấn đề cơ bản của triết học trả lời cho câu hỏi:", options: ["Con người có khả năng nhận thức thế giới hay không?", "Giữa vật chất và ý thức thì cái nào có trước, cái nào có sau, cái nào quyết định cái nào?", "Vật chất có tồn tại vĩnh viễn hay không?", "Vật chất tồn tại dưới những dạng nào?"], correctText: "Con người có khả năng nhận thức thế giới hay không?" },
        { ch: 1, question: "Cơ sở để phân chia các trào lưu triết học thành chủ nghĩa duy vật và chủ nghĩa duy tâm là:", options: ["Cách giải quyết mặt thứ hai của vấn đề cơ bản của triết học.", "Cách giải quyết vấn đề cơ bản của triết học.", "Cách giải quyết mặt thứ nhất của vấn đề cơ bản của triết học.", "Quan điểm lý luận nhận thức."], correctText: "Cách giải quyết mặt thứ nhất của vấn đề cơ bản của triết học." },
        { ch: 1, question: "Ý thức có trước, vật chất có sau, ý thức quyết định vật chất, đây là quan điểm của trường phái triết học nào?", options: ["Duy vật.", "Duy tâm.", "Nhất nguyên.", "Nhị nguyên."], correctText: "Duy tâm." },
        { ch: 1, question: "Ý thức, cảm giác của con người sinh ra và quyết định sự tồn tại của sự vật là quan điểm của trường phái nào?", options: ["Duy tâm chủ quan.", "Bất khả tri.", "Duy tâm khách quan.", "Khả tri."], correctText: "Duy tâm chủ quan." },
        { ch: 1, question: "Ý thức, ý niệm tuyệt đối sinh ra thế giới, là quan điểm của trường phái triết học nào:", options: ["Duy tâm chủ quan.", "Bất khả tri.", "Duy tâm khách quan.", "Khả tri."], correctText: "Duy tâm khách quan." },
        { ch: 1, question: "Quan niệm của chủ nghĩa duy tâm khách quan về mặt thứ nhất của vấn đề cơ bản của triết học là như thế nào?", options: ["Thừa nhận thế giới vật chất do thực thể tinh thần tạo ra.", "Thừa nhận thế giới vật chất tồn tại khách quan.", "Thừa nhận cảm giác và sự phức hợp các cảm giác của con người quyết định sự tồn tại của các sự vật.", "Thừa nhận khả năng nhận thức của con người."], correctText: "Thừa nhận thế giới vật chất do thực thể tinh thần tạo ra." },
        { ch: 1, question: "Chủ nghĩa duy tâm chủ quan có đặc điểm nổi bật nào?", options: ["Giải thích được nguồn gốc, bản chất của cảm giác, ý thức của con người.", "Thấy được tính năng động, sáng tạo của cảm giác, ý thức.", "Thừa nhận cảm giác và phức hợp các cảm giác của con người quyết định sự tồn tại của các sự vật hiện tượng.", "Thừa nhận khả năng nhận thức của con người."], correctText: "Thừa nhận cảm giác và phức hợp các cảm giác của con người quyết định sự tồn tại của các sự vật hiện tượng." },
        { ch: 1, question: "Sắp xếp các hình thức cơ bản của chủ nghĩa duy vật theo đúng trình tự phát triển:", options: ["Chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật biện chứng, chủ nghĩa duy vật chất phác.", "Chủ nghĩa duy vật tầm thường, chủ nghĩa duy vật biện chứng, chủ nghĩa duy vật siêu hình.", "Chủ nghĩa duy vật biện chứng, chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật chất phác.", "Chủ nghĩa duy vật chất phác, chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật biện chứng."], correctText: "Chủ nghĩa duy vật chất phác, chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật biện chứng." },
        { ch: 1, question: "Giải quyết mặt thứ 2 của vấn đề cơ bản của triết học trong lịch sử triết học chia thành những trường phái nào?", options: ["Chủ nghĩa duy vật và chủ nghĩa duy tâm.", "Thuyết khả tri và thuyết bất khả tri.", "Chủ nghĩa duy tâm chủ quan và chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật siêu hình."], correctText: "Thuyết khả tri và thuyết bất khả tri." },
        { ch: 1, question: "Bản chất của thuyết bất khả tri là gì?", options: ["Con người không thể nhận thức được sự tồn tại, vận động của sự vật.", "Con người không thể nhận thức được về bản chất thật sự của sự vật, hiện tượng.", "Con người có xu hướng nhận thức sai lầm về thế giới.", "Con người cần phải hiểu rõ về những giới hạn của nhận thức."], correctText: "Con người không thể nhận thức được về bản chất thật sự của sự vật, hiện tượng." },
        { ch: 1, question: "Trong các phát biểu về phương pháp nhận thức biện chứng dưới đây, phát biểu nào SAI?", options: ["Phương pháp biện chứng coi nguyên nhân của mọi biến đổi nằm ngoài đối tượng.", "Phương pháp biện chứng nhận thức đối tượng ở trong các mối liên hệ với nhau.", "Phương pháp biện chứng nhận thức đối tượng ở trạng thái vận động biến đổi.", "Phương pháp biện chứng là phương pháp nhận thức khoa học."], correctText: "Phương pháp biện chứng coi nguyên nhân của mọi biến đổi nằm ngoài đối tượng." },
        { ch: 1, question: "Chủ nghĩa Mác - Lênin ra đời vào khoảng thời gian nào?", options: ["Những năm 40 của thế kỷ XIX.", "Những năm 50 của thế kỷ XIX.", "Những năm 30 của thế kỷ XIX.", "Những năm 60 của thế kỷ XIX."], correctText: "Những năm 40 của thế kỷ XIX." },
        { ch: 1, question: "Điều kiện kinh tế - xã hội nào ở Tây Âu nửa đầu thế kỷ XIX đã dẫn đến sự ra đời của triết học Mác?", options: ["Chủ nghĩa tư bản đã hình thành và phát triển.", "Cuộc cách mạng công nghiệp phát triển mạnh mẽ.", "Chủ nghĩa tư bản đã phát triển và giai cấp vô sản xuất hiện trên vũ đài lịch sử.", "Các phong trào đấu tranh giai cấp nổ ra."], correctText: "Chủ nghĩa tư bản đã phát triển và giai cấp vô sản xuất hiện trên vũ đài lịch sử." },
        { ch: 1, question: "Trong lĩnh vực triết học, C. Mác và Ph. Ăngghen kế thừa trực tiếp những lý luận nào sau đây:", options: ["Chủ nghĩa duy vật cổ đại.", "Thuyết nguyên tử.", "Phép biện chứng trong triết học của Hêghen và quan niệm duy vật trong triết học của Phoiơbắc.", "Chủ nghĩa duy vật thế kỷ XVII - XVIII."], correctText: "Phép biện chứng trong triết học của Hêghen và quan niệm duy vật trong triết học của Phoiơbắc." },
        { ch: 1, question: "Yếu tố nào dưới đây không phải là tiền đề, nguồn gốc dẫn đến sự ra đời của Triết học Mác - Lênin?", options: ["Điều kiện kinh tế - xã hội ở Tây Âu những năm 40 của thế kỷ XIX.", "Triết học Cổ điển Đức, Chủ nghĩa xã hội không tưởng của Pháp và Kinh tế chính trị học Cổ điển Anh.", "Điều kiện kinh tế - xã hội ở Tây Âu những năm 50 của thế kỷ XVIII.", "Dựa trên những thành tựu của khoa học tự nhiên thế kỷ XIX."], correctText: "Điều kiện kinh tế - xã hội ở Tây Âu những năm 50 của thế kỷ XVIII." },
        { ch: 1, question: "Sự thất bại của các phong trào công nhân những năm nửa đầu thế kỷ XIX cho thấy điều gì?", options: ["Các phong trào này thiếu tính tổ chức.", "Các phong trào này thiếu tính linh hoạt.", "Các phong trào này thiếu lý luận khoa học soi đường.", "Các phong trào này mang tính tự phát."], correctText: "Các phong trào này thiếu lý luận khoa học soi đường." },
        { ch: 1, question: "Phát minh nào trong khoa học tự nhiên nửa đầu thế kỷ XIX vạch ra nguồn gốc tự nhiên của con người?", options: ["Học thuyết tế bào.", "Thuyết duy nghiệm.", "Định luật bảo toàn và chuyển hoá năng lượng.", "Học thuyết tiến hoá."], correctText: "Học thuyết tiến hoá." },
        { ch: 1, question: "Định luật bảo toàn và chuyển hóa năng lượng có ý nghĩa thế nào đối với sự ra đời của Triết học Mác?", options: ["Chứng minh cho sự bảo toàn về mặt năng lượng.", "Chứng minh cho tính thống nhất vật chất của thế giới.", "Chứng minh khả năng vận động, chuyển hóa của sự vật hiện tượng.", "Chứng minh cho mối liên hệ gắn bó giữa triết học và KHTN."], correctText: "Chứng minh cho tính thống nhất vật chất của thế giới." },
        { ch: 1, question: "Tác phẩm nào đánh dấu sự ra đời của Chủ nghĩa Mác – Lênin?", options: ["Luận cương về Phoiơbắc.", "Tuyên ngôn của Đảng cộng sản.", "Hệ tư tưởng Đức.", "Bản thảo kinh tế - triết học."], correctText: "Tuyên ngôn của Đảng cộng sản." },
        { ch: 1, question: "Thực chất bước chuyển cách mạng trong Triết học do C.Mác và Ph.Ănghen thực hiện là:", options: ["Thống nhất giữa thế giới quan duy vật và phép biện chứng trong một hệ thống triết học.", "Thống nhất giữa triết học của Hegel và triết học của Phoiơbắc.", "Phê phán triết học duy tâm của Hegel.", "Khái quát các thành tựu triết học trước đó."], correctText: "Thống nhất giữa thế giới quan duy vật và phép biện chứng trong một hệ thống triết học." },
        { ch: 1, question: "Phoiơbắc là nhà triết học theo trường phái triết học nào?", options: ["Chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy vật biện chứng.", "Chủ nghĩa duy vật siêu hình."], correctText: "Chủ nghĩa duy vật siêu hình." },
        { ch: 1, question: "Đâu KHÔNG phải là giá trị khoa học của chủ nghĩa Mác - Lênin?", options: ["Thế giới quan duy vật biện chứng và phương pháp luận biện chứng duy vật.", "Giá trị phê phán đối với chủ nghĩa tư bản.", "Giá trị dự báo khoa học.", "Đặt nền móng cho sự ra đời của triết học phương Tây hiện đại."], correctText: "Đặt nền móng cho sự ra đời của triết học phương Tây hiện đại." },
        { ch: 1, question: "Đâu KHÔNG phải là nguồn gốc lý luận trực tiếp dẫn tới sự ra đời của chủ nghĩa Mác - Lênin?", options: ["Triết học Cổ điển Đức.", "Chủ nghĩa xã hội không tưởng Pháp.", "Triết học Khai sáng Pháp.", "Kinh tế chính trị học cổ điển Anh."], correctText: "Triết học Khai sáng Pháp." },
        { ch: 1, question: "Chức năng của triết học Mác - Lênin là:", options: ["Chức năng chú giải văn bản.", "Chức năng làm sáng tỏ cấu trúc ngôn ngữ.", "Chức năng khoa học của các khoa học.", "Chức năng thế giới quan và phương pháp luận."], correctText: "Chức năng thế giới quan và phương pháp luận." },
        { ch: 1, question: "Chức năng phương pháp luận của triết học Mác – Lênin được hiểu là gì?", options: ["Là phương pháp tối ưu, vạn năng để nhận thức thế giới.", "Cung cấp những nguyên tắc chung nhất để định hướng hoạt động nhận thức và thực tiễn.", "Thay thế các phương pháp nghiên cứu trong các khoa học cụ thể.", "Là lý luận về phương pháp của các khoa học."], correctText: "Cung cấp những nguyên tắc chung nhất để định hướng hoạt động nhận thức và thực tiễn." },

        // CHƯƠNG 2 (80 câu)
        { ch: 2, question: "Đặc điểm chung của quan niệm duy vật về vật chất thời kỳ cổ đại là:", options: ["Đồng nhất vật chất với nguyên tử.", "Đồng nhất vật chất với khối lượng.", "Tìm nguồn gốc của thế giới ở những dạng vật chất cụ thể.", "Đồng nhất vật chất với ý thức."], correctText: "Tìm nguồn gốc của thế giới ở những dạng vật chất cụ thể." },
        { ch: 2, question: "Đâu KHÔNG PHẢI là đặc điểm của quan niệm duy vật về vật chất thời kỳ cận đại?", options: ["Chịu sự tác động mạnh mẽ của phương pháp tư duy siêu hình.", "Chịu sự tác động mạnh mẽ của phương pháp tư duy biện chứng.", "Đồng nhất vật chất với khối lượng.", "Đồng nhất vật chất với nguyên tử."], correctText: "Chịu sự tác động mạnh mẽ của phương pháp tư duy biện chứng." },
        { ch: 2, question: "Quan niệm cho rằng vật chất là phức hợp của những cảm giác của con người là của trường phái nào?", options: ["Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy vật biện chứng.", "Chủ nghĩa duy vật siêu hình."], correctText: "Chủ nghĩa duy tâm chủ quan." },
        { ch: 2, question: "Đâu KHÔNG PHẢI là tính chất của vật chất?", options: ["Tồn tại khách quan.", "Có thể cảm giác được.", "Vận động tự thân.", "Không liên quan gì đến ý thức."], correctText: "Không liên quan gì đến ý thức." },
        { ch: 2, question: "Ăngghen cho rằng, vận động là phương thức tồn tại của vật chất, điều này có nghĩa là gì?", options: ["Vận động là sự di chuyển vị trí trong không gian.", "Vận động của vật chất biểu hiện rất đa dạng.", "Các hình thức vận động có mối liên hệ với nhau.", "Vật chất tồn tại bằng cách vận động, thông qua vận động để biểu hiện sự tồn tại của nó."], correctText: "Vật chất tồn tại bằng cách vận động, thông qua vận động để biểu hiện sự tồn tại của nó." },
        { ch: 2, question: "Định nghĩa vật chất được V.I. Lênin viết trong tác phẩm nào?", options: ["Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.", "Bút ký triết học.", "Nhà nước và cách mạng.", "Sáng kiến vĩ đại."], correctText: "Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán." },
        { ch: 2, question: "V.I. Lênin đã dùng phương pháp nào để định nghĩa phạm trù vật chất?", options: ["Mô tả nhiều đối tượng vật chất cụ thể.", "Chỉ ra các bộ phận hợp thành của vật chất.", "Đặt phạm trù vật chất đối lập với phạm trù ý thức trên phương diện nhận thức luận cơ bản.", "Quy phạm trù vật chất về khái niệm rộng hơn."], correctText: "Đặt phạm trù vật chất đối lập với phạm trù ý thức trên phương diện nhận thức luận cơ bản." },
        { ch: 2, question: "Ý nghĩa định nghĩa vật chất của V.I. Lênin đối với khoa học là ở chỗ:", options: ["Chỉ ra quan niệm của các nhà khoa học là sai lầm.", "Định hướng: vật chất và ý thức đồng nhất với nhau.", "Định hướng cho sự phát triển của khoa học: vật chất là vô cùng, vô tận, không sinh ra và không mất đi.", "Giúp thấy vật chất là vô hình."], correctText: "Định hướng cho sự phát triển của khoa học: vật chất là vô cùng, vô tận, không sinh ra và không mất đi." },
        { ch: 2, question: "Tìm ra nhận định đúng:", options: ["V.I. Lênin đã giải quyết VĐCB trên lập trường duy vật siêu hình và khả tri luận.", "V.I. Lênin đã giải quyết VĐCB trên lập trường duy vật biện chứng và bất khả tri luận.", "V.I. Lênin đã giải quyết VĐCB trên lập trường duy vật siêu hình và khả tri luận.", "V.I. Lênin đã giải quyết VĐCB của triết học trên lập trường duy vật biện chứng và khả tri luận."], correctText: "V.I. Lênin đã giải quyết VĐCB của triết học trên lập trường duy vật biện chứng và khả tri luận." },
        { ch: 2, question: "Nguồn gốc của vận động theo duy vật biện chứng là:", options: ["Do ý thức tinh thần quyết định.", "Do cái hích của Thượng đế.", "Do sự tương tác ở bên ngoài.", "Nguồn gốc của vận động là ở trong bản thân sự vật, hiện tượng, do sự tác động của các mặt, các yếu tố bên trong."], correctText: "Nguồn gốc của vận động là ở trong bản thân sự vật, hiện tượng, do sự tác động của các mặt, các yếu tố bên trong." },
        { ch: 2, question: "Chủ nghĩa duy vật biện chứng quan niệm:", options: ["Vận động là tuyệt đối, đứng im là tương đối, tạm thời.", "Đứng im là tuyệt đối, vận động là tương đối.", "Vận động và đứng im là tương đối, phát triển là tuyệt đối.", "Vận động và đứng im chỉ là tương đối, tạm thời."], correctText: "Vận động là tuyệt đối, đứng im là tương đối, tạm thời." },
        { ch: 2, question: "Mệnh đề KHÔNG ĐÚNG theo quan điểm duy vật biện chứng về lao động và ý thức:", options: ["Con người là sinh vật duy nhất biết sử dụng công cụ lao động.", "Con người là sinh vật duy nhất có phản ánh ý thức.", "Con người là sinh vật duy nhất có năng lực sản xuất.", "Con người là sinh vật duy nhất có năng lực tư duy."], correctText: "Con người là sinh vật duy nhất có phản ánh ý thức." },
        { ch: 2, question: "Xác định mệnh đề đúng theo quan điểm duy vật biện chứng:", options: ["Các hình thức vận động thấp luôn bao hàm hình thức vận động cao hơn.", "Các hình thức vận động cao hiếm khi bao hàm hình thức thấp.", "Các hình thức vận động cao không bao hàm hình thức thấp.", "Các hình thức vận động cao luôn bao hàm trong nó những hình thức vận động thấp."], correctText: "Các hình thức vận động cao luôn bao hàm trong nó những hình thức vận động thấp." },
        { ch: 2, question: "Phát biểu nào dưới đây là SAI?", options: ["Nguồn gốc ý thức gồm tự nhiên và xã hội.", "Nguồn gốc tự nhiên gồm bộ não và thế giới khách quan tác động lên bộ脑.", "Nguồn gốc xã hội gồm lao động và ngôn ngữ.", "Ý thức là cái vốn có trong bộ óc của con người."], correctText: "Ý thức là cái vốn có trong bộ óc của con người." },
        { ch: 2, question: "Điều kiện cần cho sự ra đời của ý thức là:", options: ["Bộ não người.", "Bộ não người và hiện thực khách quan tác động lên bộ não.", "Năng lực chế tạo công cụ lao động.", "Năng lực ngôn ngữ phát triển."], correctText: "Bộ não người và hiện thực khách quan tác động lên bộ não." },
        { ch: 2, question: "Điều kiện đủ cho sự ra đời của ý thức là:", options: ["Lao động và ngôn ngữ.", "Bộ脑 người và hiện thực khách quan.", "Năng lực chế tạo công cụ lao động.", "Ngôn ngữ phát triển với cả tiếng nói và chữ viết."], correctText: "Lao động và ngôn ngữ." },
        { ch: 2, question: "Theo quan điểm của chủ nghĩa duy vật biện chứng:", options: ["Phản ánh của thế giới vô cơ mang tính sáng tạo.", "Phản ánh không phải cái vốn có của thế giới vật chất.", "Phản ánh là thuộc tính của mọi dạng vật chất.", "Phản ánh chỉ là ý thức con người tưởng tượng ra."], correctText: "Phản ánh là thuộc tính của mọi dạng vật chất." },
        { ch: 2, question: "Xác định nhận định đúng:", options: ["Ý thức là thuộc tính của mọi dạng vật chất.", "Vật chất sinh ra ý thức giống như gan tiết ra mật.", "Ý thức là quà tặng của Thượng Đế.", "Ý thức là thuộc tính của một dạng vật chất có tổ chức cao nhất là bộ brain người."], correctText: "Ý thức là thuộc tính của một dạng vật chất có tổ chức cao nhất là bộ brain người." },
        { ch: 2, question: "Sắp xếp đúng trình độ các hình thức phản ánh từ phức tạp đến đơn giản của vật chất:", options: ["Phản ánh ý thức -> Phản ánh vật lý, hóa học -> phản ánh sinh học -> phản ánh tâm lý.", "Phản ánh vật lý, hóa học -> phản ánh sinh học -> phản ánh tâm lý -> phản ánh ý thức.", "Phản ánh ý thức -> phản ánh tâm lý -> phản ánh sinh học -> phản ánh vật lý, hóa học.", "Phản ánh ý thức -> phản ánh sinh học -> phản ánh tâm lý -> phản ánh vật lý, hóa học."], correctText: "Phản ánh ý thức -> phản ánh tâm lý -> phản ánh sinh học -> phản ánh vật lý, hóa học." },
        { ch: 2, question: "Lựa chọn câu đúng:", options: ["Ý thức là một hiện tượng cá nhân thuần túy.", "Ý thức không là hiện tượng cá nhân cũng không là hiện tượng xã hội.", "Ý thức của con người là sự hồi tưởng của ý niệm tuyệt đối.", "Ý thức không phải thuần tuý là hiện tượng cá nhân mà là hiện tượng xã hội."], correctText: "Ý thức không phải thuần tuý là hiện tượng cá nhân mà là hiện tượng xã hội." },
        { ch: 2, question: "Bản chất của ý thức theo duy vật biện chứng là:", options: ["Sự phản ánh tích cực, năng động, sáng tạo thế giới khách quan vào trong đầu óc con người.", "Tiếp nhận và xử lý các kích thích từ môi trường.", "Hình ảnh của thế giới khách quan và suy nghĩ chủ quan.", "Quá trình vật chất vận động bên trong bộ brain."], correctText: "Sự phản ánh tích cực, năng động, sáng tạo thế giới khách quan vào trong đầu óc con người." },
        { ch: 2, question: "Ý thức là “hình ảnh chủ quan về hiện thực khách quan\", nghĩa là:", options: ["Ý thức là hình ảnh vật lý trong brain.", "Ý thức là sự sáng tạo chủ quan của chủ thể.", "Chức năng của bộ brain là tạo ra ý thức.", "Ý thức là hình ảnh tinh thần tồn tại trong brain, phản ánh tích cực, sáng tạo về hiện thực khách quan."], correctText: "Ý thức là hình ảnh tinh thần tồn tại trong brain, phản ánh tích cực, sáng tạo về hiện thực khách quan." },
        { ch: 2, question: "Chủ nghĩa duy vật biện chứng khẳng định rằng:", options: ["Ý thức quyết định vật chất, vật chất tác động trở lại.", "Ý thức quyết định vật chất hoàn toàn.", "Vật chất quyết định ý thức, ý thức có tính độc lập tương đối và tác động trở lại vật chất.", "Vật chất quyết định ý thức hoàn toàn."], correctText: "Vật chất quyết định ý thức, ý thức có tính độc lập tương đối và tác động trở lại vật chất." },
        { ch: 2, question: "Xác định câu trả lời đúng về vai trò của ý thức:", options: ["Vai trò của ý thức là sự phản ánh sáng tạo và tác động trở lại thông qua hoạt động thực tiễn.", "Ý thức là cái phụ thuộc, không năng động.", "Ý thức sao chép nguyên xi nên không có vai trò.", "Ý thức tự nó chỉ làm thay đổi tư tưởng."], correctText: "Vai trò của ý thức là sự phản ánh sáng tạo và tác động trở lại thông qua hoạt động thực tiễn." },
        { ch: 2, question: "Nguyên tắc phương pháp luận chủ đạo rút ra từ mối quan hệ giữa vật chất và ý thức là:", options: ["Nguyên tắc toàn diện.", "Nguyên tắc lịch sử - cụ thể.", "Nguyên tắc thống nhất giữa lý luận và thực tiễn.", "Nguyên tắc tôn trọng tính khách quan kết hợp với phát huy tính năng động chủ quan."], correctText: "Nguyên tắc tôn trọng tính khách quan kết hợp với phát huy tính năng động chủ quan." },
        { ch: 2, question: "Biện chứng khách quan là phạm trù dùng để chỉ...", options: ["Biện chứng của nhận thức con người.", "Biện chứng của tư duy phản ánh thế giới.", "Biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người.", "Sự phản ánh biện chứng khách quan vào brain."], correctText: "Biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người." },
        { ch: 2, question: "Phát biểu nào dưới đây là SAI?", options: ["Mối liên hệ phổ biến có tính khách quan.", "Mối liên hệ phổ biến có tính đa dạng, phong phú.", "Mối liên hệ giữa các sự vật có tính phổ biến.", "Mối liên hệ giữa các sự vật, hiện tượng chỉ là do con người tưởng tượng ra."], correctText: "Mối liên hệ giữa các sự vật, hiện tượng chỉ là do con người tưởng tượng ra." },
        { ch: 2, question: "Cơ sở mối liên hệ các sự vật là ở tính thống nhất vật chất của thế giới là quan niệm của:", options: ["Chủ nghĩa duy vật chất phác.", "Chủ nghĩa duy vật siêu hình.", "Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy vật biện chứng."], correctText: "Chủ nghĩa duy vật biện chứng." },
        { ch: 2, question: "Câu chuyện dân gian nào đưa ra bài học về sự cần thiết của quan điểm toàn diện?", options: ["Đẽo cày giữa đường.", "Trí khôn của ta đây.", "Cóc kiện trời.", "Thầy bói xem voi."], correctText: "Thầy bói xem voi." },
        { ch: 2, question: "Chủ nghĩa duy vật biện chứng cho rằng:", options: ["Phát triển chỉ là tăng đơn thuần về lượng.", "Phát triển chỉ là kết quả của cảm giác.", "Phát triển chỉ diễn ra trong xã hội.", "Phát triển là sự vận động đi lên, từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn."], correctText: "Phát triển là sự vận động đi lên, từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn." },
        { ch: 2, question: "Từ nguyên lý về sự phát triển, chúng ta rút ra nguyên tắc phương pháp luận nào?", options: ["Nguyên tắc khách quan.", "Nguyên tắc phát triển.", "Nguyên tắc toàn diện.", "Nguyên tắc thống nhất giữa lý luận và thực tiễn."], correctText: "Nguyên tắc phát triển." },
        { ch: 2, question: "Giả sử Hà Nội là một cái riêng thì yếu tố nào sau đây là cái đơn nhất của nó?", options: ["Thủ đô nước CHXHCN Việt Nam.", "Mật độ dân số cao.", "Ô nhiễm không khí nghiêm trọng.", "Lối sống đô thị."], correctText: "Thủ đô nước CHXHCN Việt Nam." },
        { ch: 2, question: "Phát biểu đúng với quan niệm của triết học Mác - Lênin về cái chung và cái riêng:", options: ["Cái chung bao trùm toàn bộ cái riêng.", "Chỉ cái chung tồn tại thực.", "Chỉ cái riêng tồn tại thực.", "Cái chung, cái riêng cùng tồn tại khách quan, giữa chúng có mối quan hệ hữu cơ."], correctText: "Cái chung, cái riêng cùng tồn tại khách quan, giữa chúng có mối quan hệ hữu cơ." },
        { ch: 2, question: "Vì sao phải phân tích kỹ các nguyên nhân gây ra một kết quả?", options: ["Vì một kết quả do nhiều nguyên nhân sinh ra và vai trò như nhau.", "Vì mọi kết quả đều do nguyên nhân sinh ra.", "Vì một kết quả do nhiều nguyên nhân sinh ra và các nguyên nhân ấy có vị trí, vai trò khác nhau.", "Vì một nguyên nhân sinh nhiều kết quả."], correctText: "Vì một kết quả do nhiều nguyên nhân sinh ra và các nguyên nhân ấy có vị trí, vai trò khác nhau." },
        { ch: 2, question: "Vì sao không được phủ nhận mối quan hệ nhân – quả?", options: ["Vì mối liên hệ nhân - quả biểu hiện phức tạp.", "Vì nguyên nhân và kết quả chuyển hóa lẫn nhau.", "Vì nguyên nhân có trước, kết quả có sau.", "Vì mối liên hệ nhân – quả tồn tại khách quan."], correctText: "Vì mối liên hệ nhân – quả tồn tại khách quan." },
        { ch: 2, question: "Điền từ: “Phạm trù tất nhiên dùng để chỉ cái do .... của kết cấu vật chất quyết định...”", options: ["Những nguyên nhân cơ bản, bên trong.", "Những nguyên nhân bên ngoài.", "Những nguyên nhân không cơ bản.", "Những nguyên nhân thứ yếu."], correctText: "Những nguyên nhân cơ bản, bên trong." },
        { ch: 2, question: "Triết học Mác - Lênin cho rằng:", options: ["Cả tất nhiên và ngẫu nhiên đều có tính quy luật.", "Ngẫu nhiên mang tính xác suất, chỉ tất nhiên có quy luật.", "Mọi thứ đều là tất nhiên.", "Tất nhiên và ngẫu nhiên đều không có quy luật."], correctText: "Cả tất nhiên và ngẫu nhiên đều có tính quy luật." },
        { ch: 2, question: "Phạm trù chỉ cách thức liên hệ, tổ chức, sắp xếp các phần tử cấu thành đối tượng là:", options: ["Bản chất.", "Hiện tượng.", "Nội dung.", "Hình thức."], correctText: "Hình thức." },
        { ch: 2, question: "Vì sao trong nhận thức và thực tiễn ta không được xem nhẹ hình thức?", options: ["Vì hình thức thường xuyên biến đổi.", "Vì hình thức ổn định hơn nội dung.", "Vì hình thức có tính độc lập tương đối đối với nội dung.", "Vì hình thức quyết định nội dung."], correctText: "Vì hình thức có tính độc lập tương đối đối với nội dung." },
        { ch: 2, question: "Phạm trù chỉ tổng thể các mối liên hệ khách quan, tất nhiên, tương đối ổn định bên trong sự vật là:", options: ["Nội dung.", "Hình thức.", "Bản chất.", "Hiện tượng."], correctText: "Bản chất." },
        { ch: 2, question: "Hiện tượng nào vi phạm nguyên tắc phương pháp luận từ mối quan hệ giữa hiện tượng và bản chất?", options: ["Không ngừng thu thập các hiện tượng.", "Đề cao kinh nghiệm, tuyệt đối hóa vai trò của kinh nghiệm.", "Phát triển khoa học để tìm bản chất.", "Căn cứ bản chất để cải tạo."], correctText: "Đề cao kinh nghiệm, tuyệt đối hóa vai trò của kinh nghiệm." },
        { ch: 2, question: "Nhận định nào dưới đây là đúng về khả năng và hiện thực?", options: ["Chỉ cần dựa vào khả năng.", "Chỉ cần dựa vào hiện thực.", "Trong hoạt động thực tiễn cần dựa vào hiện thực và cũng phải tính đến các khả năng.", "Không cần dựa vào hiện thực."], correctText: "Trong hoạt động thực tiễn cần dựa vào hiện thực và cũng phải tính đến các khả năng." },
        { ch: 2, question: "Áp dụng dập khuôn cách học của người này cho người khác là vi phạm cặp phạm trù nào?", options: ["Nguyên nhân và kết quả.", "Bản chất và hiện tượng.", "Cái chung và cái riêng.", "Khả năng và hiện thực."], correctText: "Cái chung và cái riêng." },
        { ch: 2, question: "Quy luật từ sự thay đổi về lượng dẫn đến sự thay đổi về chất chỉ rõ:", options: ["Khuynh hướng của sự phát triển.", "Cách thức của sự vận động và phát triển.", "Nguồn gốc của sự phát triển.", "Động lực của sự phát triển."], correctText: "Cách thức của sự vận động và phát triển." },
        { ch: 2, question: "Phát biểu đúng về phạm trù “chất” trong Quy luật lượng - chất:", options: ["Chất là chất liệu.", "Chất là bản chất.", "Chất là sự tồn tại khách quan.", "Chất là sự thống nhất hữu cơ của những thuộc tính làm cho sự vật là nó chứ không phải là cái khác."], correctText: "Chất là sự thống nhất hữu cơ của những thuộc tính làm cho sự vật là nó chứ không phải là cái khác." },
        { ch: 2, question: "Phát biểu đúng về phạm trù \"lượng\":", options: ["Lượng là số thuộc tính.", "Lượng là phạm trù số học.", "Lượng là phạm trù khoa học cụ thể.", "Lượng là phạm trù triết học, chỉ tính quy định khách quan vốn có về số lượng, quy mô, tốc độ, nhịp điệu vận động."], correctText: "Lượng là phạm trù triết học, chỉ tính quy định khách quan vốn có về số lượng, quy mô, tốc độ, nhịp điệu vận động." },
        { ch: 2, question: "Đâu KHÔNG phải là lượng tương ứng của chất “sinh viên giỏi”?", options: ["Điểm số các môn học.", "Thành tích NCKH.", "Thành tích tình nguyện.", "Mức độ thường xuyên tham gia phát biểu ý kiến xây dựng bài."], correctText: "Mức độ thường xuyên tham gia phát biểu ý kiến xây dựng bài." },
        { ch: 2, question: "Chọn phát biểu đúng về phạm trù “độ”:", options: ["Độ là khoảng giới hạn làm biến đổi chất.", "Độ là sự biến đổi chất và lượng.", "Độ là giới hạn mà sự thay đổi về lượng bất kỳ cũng làm biến đổi chất.", "Độ thể hiện sự thống nhất giữa lượng và chất, chỉ khoảng giới hạn trong đó sự thay đổi về lượng chưa làm thay đổi căn bản về chất."], correctText: "Độ thể hiện sự thống nhất giữa lượng và chất, chỉ khoảng giới hạn trong đó sự thay đổi về lượng chưa làm thay đổi căn bản về chất." },
        { ch: 2, question: "Phán đoán SAI về quan hệ giữa chất và lượng:", options: ["Mỗi chất có lượng tương ứng.", "Mọi sự vật là thống nhất giữa chất và lượng.", "Sự phân biệt giữa chất và lượng là tương đối.", "Sự thay đổi về lượng và sự thay đổi về chất của sự vật là độc lập với nhau, không liên quan."], correctText: "Sự thay đổi về lượng và sự thay đổi về chất của sự vật là độc lập với nhau, không liên quan." },
        { ch: 2, question: "Đăng ký nhiều môn để mau tốt nghiệp mà xem nhẹ chất lượng là vi phạm quy luật nào?", options: ["Quy luật chuyển hóa từ sự thay đổi về lượng đến sự thay đổi về chất và ngược lại.", "Quy luật thống nhất và đấu tranh giữa các mặt đối lập.", "Quy luật phủ định của phủ định.", "Quy luật nhận thức."], correctText: "Quy luật chuyển hóa từ sự thay đổi về lượng đến sự thay đổi về chất và ngược lại." },
        { ch: 2, question: "Vai trò của quy luật thống nhất và đấu tranh của các mặt đối lập chỉ ra:", options: ["Nguồn gốc của sự vận động và phát triển.", "Xu hướng của sự phát triển.", "Cách thức của sự phát triển.", "Con đường của sự phát triển."], correctText: "Nguồn gốc của sự vận động và phát triển." },
        { ch: 2, question: "Chọn phán đoán đúng về mặt đối lập:", options: ["Những mặt khác nhau đều là mặt đối lập.", "Mặt đối lập là những mặt có khuynh hướng biến đổi trái ngược nhau trong cùng một sự vật.", "Những mặt chung một sự vật đều là đối lập.", "Mọi sự vật không hề có bài trừ lẫn nhau."], correctText: "Mặt đối lập là những mặt có khuynh hướng biến đổi trái ngược nhau trong cùng một sự vật." },
        { ch: 2, question: "Chọn mệnh đề đúng về sự đấu tranh của các mặt đối lập:", options: ["Đấu tranh là tạm thời.", "Đấu tranh giữa các mặt đối lập là tuyệt đối.", "Đấu tranh là tương đối.", "Đấu tranh vừa tuyệt đối vừa tương đối."], correctText: "Đấu tranh giữa các mặt đối lập là tuyệt đối." },
        { ch: 2, question: "Sự thống nhất của hai mặt đối lập là:", options: ["Sự bài trừ gạt bỏ lẫn nhau.", "Sự liên hệ, quy định, xâm nhập vào nhau tạo thành một chỉnh thể.", "Hai mặt đối lập giảm sự khác biệt.", "Hai mặt đối lập có tính chất trái ngược."], correctText: "Sự liên hệ, quy định, xâm nhập vào nhau tạo thành một chỉnh thể." },
        { ch: 2, question: "Khái niệm chỉ sự tác động qua lại theo hướng bài trừ, phủ định lẫn nhau giữa các mặt đối lập là:", options: ["Thống nhất giữa các mặt đối lập.", "Đấu tranh giữa các mặt đối lập.", "Chuyển hóa giữa các mặt đối lập.", "Mâu thuẫn giữa các mặt đối lập."], correctText: "Đấu tranh giữa các mặt đối lập." },
        { ch: 2, question: "Phán đoán đúng về mối quan hệ giữa thống nhất và đấu tranh của các mặt đối lập:", options: ["Không thống nhất vẫn có đấu tranh.", "Không đấu tranh vẫn có thống nhất.", "Sự thống nhất và đấu tranh của các mặt đối lập là không thể tách rời nhau.", "Sự đấu tranh vừa tương đối vừa tuyệt đối."], correctText: "Sự thống nhất và đấu tranh của các mặt đối lập là không thể tách rời nhau." },
        { ch: 2, question: "Cách đúng đắn để giải quyết mâu thuẫn biện chứng là:", options: ["Thủ tiêu các mặt đối lập.", "Kiềm chế các mặt đối lập.", "Chuyển hóa các mặt đối lập.", "Giữ mặt đối lập này và gạt bỏ mặt khác."], correctText: "Chuyển hóa các mặt đối lập." },
        { ch: 2, question: "Chỉ ra nhận định SAI về phủ định biện chứng:", options: ["Phủ định biện chứng mang tính khách quan.", "Phủ định biện chứng mang tính kế thừa.", "Phủ định biện chứng là sự tự phủ định.", "Phủ định biện chứng là sự trải qua hai lần phủ định."], correctText: "Phủ định biện chứng là sự trải qua hai lần phủ định." },
        { ch: 2, question: "Theo quan điểm siêu hình thì sự phủ định là?", options: ["Sự thay thế sự vật này bằng sự vật khác.", "Xoá bỏ hoàn toàn cái cũ, chấm dứt sự phát triển của sự vật.", "Là tiền đề cho sự phát triển.", "Là sự kế thừa cái cũ."], correctText: "Xoá bỏ hoàn toàn cái cũ, chấm dứt sự phát triển của sự vật." },
        { ch: 2, question: "Phủ định biện chứng diễn ra theo hình thức nào?", options: ["Đường thẳng đi lên.", "Đồ thị hình sin.", "Đường dích dắc.", "Đường xoáy ốc đi lên."], correctText: "Đường xoáy ốc đi lên." },
        { ch: 2, question: "Theo quy luật phủ định của phủ định, kết thúc một chu kỳ phát triển, sự vật:", options: ["Quay trở lại xuất phát điểm.", "Kết thúc quá trình phát triển.", "Lặp lại chu kỳ như trước.", "Mở ra một chu kỳ phát triển mới trên cơ sở cao hơn."], correctText: "Mở ra một chu kỳ phát triển mới trên cơ sở cao hơn." },
        { ch: 2, question: "Đâu KHÔNG phải là tính chất chung của phủ định biện chứng:", options: ["Tính khách quan.", "Tính phổ biến.", "Tính đa dạng, phong phú.", "Phủ định biện chứng có tính kế thừa siêu hình."], correctText: "Phủ định biện chứng có tính kế thừa siêu hình." },
        { ch: 2, question: "Đâu KHÔNG phải là tính chất của phủ định của phủ định?", options: ["Tính toàn diện.", "Tính chu kỳ.", "Tính phát triển về chất.", "Tính kế thừa."], correctText: "Tính toàn diện." },
        { ch: 2, question: "Chỉ ra phát biểu đúng về phủ định của phủ định:", options: ["Sự vật quay lại hoàn toàn điểm xuất phát.", "Có tính chất khép kín.", "Phủ định của phủ định có tính chất chu kỳ, đưa sự vật dường như quay trở lại trạng thái cũ, kết thúc một chu kỳ và mở ra chu kỳ mới.", "Lặp lại chu kỳ cũ."], correctText: "Phủ định của phủ định có tính chất chu kỳ, đưa sự vật dường như quay trở lại trạng thái cũ, kết thúc một chu kỳ và mở ra chu kỳ mới." },
        { ch: 2, question: "Câu SAI về ý nghĩa phương pháp luận từ quy luật phủ định của phủ định:", options: ["Phải ủng hộ và tạo điều kiện cho cái mới.", "Khắc phục tư tưởng giáo điều, bảo thủ.", "Phải có quan điểm biện chứng trong kế thừa.", "Cần kế thừa hoàn toàn cái cũ để tạo ra phát triển của cái mới."], correctText: "Cần kế thừa hoàn toàn cái cũ để tạo ra phát triển của cái mới." },
        { ch: 2, question: "Bản chất của nhận thức theo triết học Mác - Lênin là:", options: ["Tự nhận thức của con người.", "Sự tiến gần của tư duy đến khách thể.", "Quá trình phản ánh của sinh vật.", "Sự phản ánh tích cực, tự giác và sáng tạo thế giới khách quan vào bộ脑 con người trên cơ sở thực tiễn."], correctText: "Sự phản ánh tích cực, tự giác và sáng tạo thế giới khách quan vào bộ脑 con người trên cơ sở thực tiễn." },
        { ch: 2, question: "Trường phái cho rằng nhận thức chỉ là phản ánh trạng thái chủ quan của con người là:", options: ["Chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy vật biện chứng.", "Chủ nghĩa duy vật siêu hình."], correctText: "Chủ nghĩa duy tâm chủ quan." },
        { ch: 2, question: "Trường phái cho rằng nhận thức là tự nhận thức của \"Ý niệm tuyệt đối\" là:", options: ["Chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy vật biện chứng.", "Chủ nghĩa duy vật siêu hình."], correctText: "Chủ nghĩa duy tâm khách quan." },
        { ch: 2, question: "Luận điểm “Từ trực quan sinh động đến tư duy trừu tượng...” là của ai (1) và tác phẩm nào (2)?", options: ["(1) C. Mác; (2) Luận cương về Phoiơbắc.", "(1) V.I. Lênin; (2) Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.", "(1) Ph. Ăngghen; (2) Biện chứng của tự nhiên.", "(1) V.I. Lênin; (2) Bút ký triết học."], correctText: "(1) V.I. Lênin; (2) Bút ký triết học." },
        { ch: 2, question: "Giai đoạn nhận thức diễn ra trên cơ sở sự tác động trực tiếp lên các giác quan là:", options: ["Nhận thức lý tính.", "Nhận thức lý luận.", "Nhận thức cảm tính.", "Nhận thức khoa học."], correctText: "Nhận thức cảm tính." },
        { ch: 2, question: "Luận điểm “Cảm giác là hình ảnh chủ quan về thế giới khách quan” thuộc trường phái nào?", options: ["Chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy tâm khách quan.", "Thuyết nhị nguyên.", "Chủ nghĩa duy vật biện chứng."], correctText: "Chủ nghĩa duy vật biện chứng." },
        { ch: 2, question: "Nhận thức lý tính được thực hiện dưới những hình thức nào?", options: ["Cảm giác, tri giác và biểu tượng.", "Cảm giác, khái niệm, suy luận.", "Khái niệm, phán đoán, suy luận.", "Tri giác, biểu tượng, khái niệm."], correctText: "Khái niệm, phán đoán, suy luận." },
        { ch: 2, question: "Điền từ: \"Thực tiễn là toàn bộ.......... có mục đích mang tính lịch sử - xã hội của con người...\"", options: ["Hoạt động vật chất.", "Hoạt động tinh thần.", "Hoạt động vật chất và tinh thần.", "Hoạt động sản xuất."], correctText: "Hoạt động vật chất." },
        { ch: 2, question: "Phát biểu nào dưới đây là SAI?", options: ["Thực tiễn chỉ là những hoạt động vật chất - cảm tính.", "Thực tiễn mang tính lịch sử - xã hội.", "Thực tiễn có mục đích cải tạo tự nhiên và xã hội.", "Thực tiễn là toàn bộ những hoạt động vật chất và tinh thần của con người."], correctText: "Thực tiễn là toàn bộ những hoạt động vật chất và tinh thần của con người." },
        { ch: 2, question: "Hình thức hoạt động thực tiễn cơ bản, đầu tiên là:", options: ["Hoạt động thực nghiệm khoa học.", "Hoạt động nghiên cứu khoa học.", "Hoạt động sản xuất vật chất.", "Hoạt động chính trị - xã hội."], correctText: "Hoạt động sản xuất vật chất." },
        { ch: 2, question: "Điền từ: “... là hoạt động thực tiễn thể hiện tính tự giác cao nhằm biến đổi, cải tạo xã hội...”", options: ["Hoạt động thực nghiệm khoa học.", "Hoạt động nghiên cứu khoa học.", "Hoạt động sản xuất vật chất.", "Hoạt động chính trị - xã hội."], correctText: "Hoạt động chính trị - xã hội." },
        { ch: 2, question: "Lựa chọn phát biểu đúng về tiêu chuẩn chân lý của thực tiễn:", options: ["Hoàn toàn có tính chất tuyệt đối.", "Hoàn toàn có tính tương đối.", "Thực tiễn là tiêu chuẩn của chân lý vừa có tính chất tuyệt đối, vừa có tính chất tương đối.", "Không phải là tiêu chuẩn khách quan."], correctText: "Thực tiễn là tiêu chuẩn của chân lý vừa có tính chất tuyệt đối, vừa có tính chất tương đối." },
        { ch: 2, question: "Đâu KHÔNG PHẢI là hoạt động thực tiễn?", options: ["Giảng dạy triết học trên lớp.", "Viết nhật ký cá nhân không chia sẻ với ai.", "Trình diễn nhạc giao hưởng.", "Nghiên cứu khoa học thực nghiệm trong phòng thí nghiệm."], correctText: "Viết nhật ký cá nhân không chia sẻ với ai." },
        { ch: 2, question: "Thực tiễn là gì?", options: ["Là hoạt động vật chất và tinh thần.", "Là hoạt động vật chất có mục đích mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội.", "Là hoạt động tinh thần.", "Là hoạt động giải trí."], correctText: "Là hoạt động vật chất có mục đích mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội." },
        { ch: 2, question: "Thực tiễn đóng vai trò gì đối với nhận thức?", options: ["Là điểm khởi đầu.", "Là đích đến.", "Là cơ sở, động lực, mục đích của nhận thức và là tiêu chuẩn của chân lý.", "Tồn tại song hành."], correctText: "Là cơ sở, động lực, mục đích của nhận thức và là tiêu chuẩn của chân lý." },

        // CHƯƠNG 3 (80 câu)
        { ch: 3, question: "Xã hội có các loại hình sản xuất cơ bản là:", options: ["Sản xuất ra văn hóa, con người và tinh thần.", "Sản xuất ra của cải vật chất, tinh thần và nghệ thuật.", "Sản xuất vật chất, sản xuất tinh thần, sản xuất ra bản thân con người.", "Sản xuất vật chất, tinh thần, văn hóa."], correctText: "Sản xuất vật chất, sản xuất tinh thần, sản xuất ra bản thân con người." },
        { ch: 3, question: "Tiền đề xuất phát của quan điểm duy vật lịch sử là:", options: ["Con người trừu tượng.", "Con người hành động.", "Con người tư duy.", "Con người hiện thực."], correctText: "Con người hiện thực." },
        { ch: 3, question: "Điền từ và tác giả: “Điểm khác biệt căn bản giữa xã hội loài người với loài vật là ở chỗ: loài vật may mắn lắm chỉ hái lượm trong khi con người lại ........(1)......\" (........(2)......).", options: ["1) Biết sáng tạo, 2) Ph. Ăngghen.", "1) Sản xuất, 2) Ph. Ăngghen.", "1) Tiến hành lao động, 2) C. Mác.", "1) Tư duy, 2) V.I. Lênin."], correctText: "1) Sản xuất, 2) Ph. Ăngghen." },
        { ch: 3, question: "Điền từ: \"..... là cơ sở của sự tồn tại và phát triển của xã hội loài người, và xét đến cùng quyết định toàn bộ sự vận động của đời sống xã hội.\"", options: ["Hoạt động tinh thần.", "Sản xuất tinh thần.", "Hoạt động vật chất.", "Sản xuất vật chất."], correctText: "Sản xuất vật chất." },
        { ch: 3, question: "Tiêu chuẩn quan trọng nhất để phân biệt các thời đại kinh tế là:", options: ["Thể chế chính trị.", "Hình thức nhà nước.", "Phương thức sản xuất.", "Hình thức tôn giáo."], correctText: "Phương thức sản xuất." },
        { ch: 3, question: "Phương thức sản xuất là:", options: ["Cách thức con người tiến hành mọi hoạt động sản xuất.", "Cách thức con người sản xuất ra của cải vật chất.", "Cách thức con người thực hiện quan hệ xã hội.", "Cách thức con người thực hiện trong quá trình sản xuất vật chất ở những giai đoạn lịch sử nhất định."], correctText: "Cách thức con người thực hiện trong quá trình sản xuất vật chất ở những giai đoạn lịch sử nhất định." },
        { ch: 3, question: "Điền từ: \"... là tổng hợp các yếu tố vật chất và tinh thần tạo thành sức mạnh thực tiễn cải biến giới tự nhiên...\"", options: ["Công cụ lao động.", "Lực lượng sản xuất.", "Người lao động.", "Tư liệu sản xuất."], correctText: "Lực lượng sản xuất." },
        { ch: 3, question: "Lực lượng sản xuất bao gồm các nhân tố nào?", options: ["Người lao động và tư liệu sản xuất.", "Người lao động và công cụ lao động.", "Người lao động và tư liệu lao động.", "Người lao động và đối tượng lao động."], correctText: "Người lao động và tư liệu sản xuất." },
        { ch: 3, question: "Tư liệu sản xuất bao gồm những yếu tố nào?", options: ["Tư liệu lao động và đối tượng lao động.", "Công cụ lao động và tư liệu lao động.", "Phương tiện lao động và công cụ lao động.", "Công cụ lao động và đối tượng lao động."], correctText: "Tư liệu lao động và đối tượng lao động." },
        { ch: 3, question: "Yếu tố phản ánh rõ nhất trình độ phát triển của lực lượng sản xuất là:", options: ["Phương tiện lao động.", "Công cụ lao động.", "Đối tượng lao động.", "Sản phẩm của lao động."], correctText: "Công cụ lao động." },
        { ch: 3, question: "Điền từ: “... là nội dung vật chất của quá trình sản xuất”.", options: ["Lực lượng sản xuất.", "Quan hệ sản xuất.", "Phương thức sản xuất.", "Sản xuất vật chất."], correctText: "Lực lượng sản xuất." },
        { ch: 3, question: "Quan hệ sản xuất là:", options: ["Mối quan hệ giữa con người với đối tượng lao động.", "Mối quan hệ giữa con người với công cụ lao động.", "Mối quan hệ giữa con người với tư liệu sản xuất.", "Mối quan hệ giữa người với người trong quá trình sản xuất."], correctText: "Mối quan hệ giữa người với người trong quá trình sản xuất." },
        { ch: 3, question: "Quan hệ cơ bản nhất, đóng vai trò quyết định trong hệ thống quan hệ sản xuất là:", options: ["Quan hệ tổ chức sản xuất.", "Quan hệ quản lý sản xuất.", "Quan hệ phân phối.", "Quan hệ sở hữu về tư liệu sản xuất."], correctText: "Quan hệ sở hữu về tư liệu sản xuất." },
        { ch: 3, question: "Mối quan hệ “song trùng” của nền sản xuất vật chất mà C. Mác nhắc đến là:", options: ["Quan hệ con người với tự nhiên và quan hệ với sản phẩm.", "Quan hệ con người với tự nhiên và quan hệ với tư liệu sản xuất.", "Quan hệ giữa con người với tự nhiên và quan hệ giữa người với người trong quá trình sản xuất vật chất.", "Quan hệ người với người và quan hệ giai cấp."], correctText: "Quan hệ giữa con người với tự nhiên và quan hệ giữa người với người trong quá trình sản xuất vật chất." },
        { ch: 3, question: "Sự biến đổi của quan hệ sản xuất do yếu tố nào quyết định?", options: ["Sự phong phú của đối tượng lao động.", "Thể chế chính trị.", "Trình độ của lực lượng sản xuất.", "Trình độ người lao động."], correctText: "Trình độ của lực lượng sản xuất." },
        { ch: 3, question: "Điền từ: \".....(1)..... và.....(2)..... là hai mặt cơ bản, tất yếu của quá trình sản xuất\"", options: ["Cơ sở hạ tầng/kiến trúc thượng tầng.", "Cơ sở hạ tầng/quan hệ sản xuất.", "Lực lượng sản xuất/quan hệ sản xuất.", "Lực lượng sản xuất/kiến trúc thượng tầng."], correctText: "Lực lượng sản xuất/quan hệ sản xuất." },
        { ch: 3, question: "Mối quan hệ giữa LLSX và QHSX được phát biểu đúng là:", options: ["LLSX phụ thuộc vào QHSX.", "Quan hệ sản xuất phụ thuộc vào trình độ phát triển của lực lượng sản xuất.", "LLSX và QHSX tồn tại độc lập.", "Đều phụ thuộc vào nhà nước."], correctText: "Quan hệ sản xuất phụ thuộc vào trình độ phát triển của lực lượng sản xuất." },
        { ch: 3, question: "Điền từ: “... là hình thức xã hội của quá trình sản xuất”.", options: ["Lực lượng sản xuất.", "Quan hệ sản xuất.", "Phương thức sản xuất.", "Sản xuất vật chất."], correctText: "Quan hệ sản xuất." },
        { ch: 3, question: "Yếu tố quan trọng nhất trong lực lượng sản xuất là:", options: ["Công cụ lao động.", "Tư liệu sản xuất.", "Người lao động.", "Tài nguyên khoáng sản."], correctText: "Người lao động." },
        { ch: 3, question: "Theo quan niệm của triết học Mác – Lênin, quan hệ sản xuất:", options: ["Hoàn toàn bị quy định bởi lãnh đạo.", "Hoàn toàn bị quy định bởi chế độ chính trị.", "Hoàn toàn bị quy định bởi tập tục.", "Tồn tại khách quan và không phụ thuộc vào ý thức của con người."], correctText: "Tồn tại khách quan và không phụ thuộc vào ý thức của con người." },
        { ch: 3, question: "Điền từ: “Trong một ...(1)... thì ...(2)... là yếu tố thường xuyên biến đổi, còn...(3)... là yếu tố tương đối ổn định.”", options: ["1) quan hệ sản xuất, 2) quan hệ phân phối, 3) quan hệ sở hữu.", "1) lực lượng sản xuất, 2) người lao động, 3) tư liệu sản xuất.", "1) phương thức sản xuất, 2) lực lượng sản xuất, 3) quan hệ sản xuất.", "1) phương thức sản xuất, 2) quan hệ sản xuất, 3) tư liệu sản xuất."], correctText: "1) phương thức sản xuất, 2) lực lượng sản xuất, 3) quan hệ sản xuất." },
        { ch: 3, question: "Quan hệ sản xuất tác động trở lại lực lượng sản xuất thông qua yếu tố nào?", options: ["Công cụ lao động.", "Tư liệu sản xuất.", "Người lao động.", "Đối tượng lao động."], correctText: "Người lao động." },
        { ch: 3, question: "Sự tồn tại nền kinh tế nhiều thành phần ở Việt Nam do yếu tố nào quy định?", options: ["Đặc điểm tự nhiên.", "Thành phần giai cấp.", "Trình độ của lực lượng sản xuất của Việt Nam quy định.", "Nhận thức chính trị."], correctText: "Trình độ của lực lượng sản xuất của Việt Nam quy định." },
        { ch: 3, question: "Trong thời kỳ quá độ lên CNXH, Việt Nam cần:", options: ["Chủ động thiết lập QHSX trước.", "Chủ động xây dựng LLSX trước.", "Kết hợp đồng thời phát triển lực lượng sản xuất với xác lập quan hệ sản xuất phù hợp.", "Không can thiệp."], correctText: "Kết hợp đồng thời phát triển lực lượng sản xuất với xác lập quan hệ sản xuất phù hợp." },
        { ch: 3, question: "Cơ sở hạ tầng là:", options: ["Toàn bộ đất đai, máy móc.", "Toàn bộ những quan hệ sản xuất hợp thành cơ sở kinh tế của một xã hội nhất định.", "Toàn bộ sinh hoạt vật chất.", "Toàn bộ cơ cấu kinh tế."], correctText: "Toàn bộ những quan hệ sản xuất hợp thành cơ sở kinh tế của một xã hội nhất định." },
        { ch: 3, question: "Nhân tố nào trong kiến trúc thượng tầng có tác động mạnh nhất tới cơ sở kinh tế?", options: ["Các chính đảng.", "Nhà nước.", "Các đoàn thể.", "Giáo hội."], correctText: "Nhà nước." },
        { ch: 3, question: "Cơ sở làm phát sinh các quan điểm chính trị, pháp luật, đạo đức là:", options: ["Kiến trúc thượng tầng.", "Trình độ nhận thức.", "Cơ sở hạ tầng.", "Trình độ LLSX."], correctText: "Cơ sở hạ tầng." },
        { ch: 3, question: "Phát biểu đúng nhất về vai trò của kiến trúc thượng tầng đối với cơ sở hạ tầng:", options: ["Chịu sự quyết định hoàn toàn.", "Luôn tác động tích cực.", "Kiến trúc thượng tầng thường xuyên có vai trò tác động trở lại cơ sở hạ tầng của xã hội.", "Quyết định cơ sở hạ tầng."], correctText: "Kiến trúc thượng tầng thường xuyên có vai trò tác động trở lại cơ sở hạ tầng của xã hội." },
        { ch: 3, question: "Thực chất của quan hệ biện chứng giữa CSHT và KTTT quy về:", options: ["Quan hệ đời sống vật chất và tinh thần.", "Quan hệ vật chất và ý thức.", "Quan hệ tồn tại xã hội và ý thức xã hội.", "Quan hệ giữa kinh tế và chính trị."], correctText: "Quan hệ giữa kinh tế và chính trị." },
        { ch: 3, question: "Nguyên nhân sâu xa làm cơ sở hạ tầng biến đổi dẫn đến kiến trúc thượng tầng biến đổi là:", options: ["Lực lượng sản xuất.", "Quan hệ sản xuất.", "Cơ sở hạ tầng.", "Nhà nước."], correctText: "Lực lượng sản xuất." },
        { ch: 3, question: "Khi cơ sở hạ tầng thay đổi thì kiến trúc thượng tầng biến đổi như thế nào?", options: ["Mọi yếu tố thay đổi ngay.", "Nhà nước, tôn giáo, đạo đức thay đổi ngay.", "Tôn giáo, nghệ thuật, triết học thay đổi ngay.", "Không phải mọi yếu tố của kiến trúc thượng tầng sẽ thay đổi theo ngay."], correctText: "Không phải mọi yếu tố của kiến trúc thượng tầng sẽ thay đổi theo ngay." },
        { ch: 3, question: "Bàn về KTTT, duy vật lịch sử KHÔNG cho rằng:", options: ["CSHT quyết định KTTT.", "CSHT thay đổi thì KTTT thay đổi theo.", "Mọi sự thay đổi của kiến trúc thượng tầng đều do sự thay đổi của cơ sở hạ tầng gây ra.", "KTTT có thể lạc hậu."], correctText: "Mọi sự thay đổi của kiến trúc thượng tầng đều do sự thay đổi của cơ sở hạ tầng gây ra." },
        { ch: 3, question: "Hãy chỉ ra luận điểm SAI:", options: ["CSHT thay đổi kéo theo KTTT thay đổi.", "Khi cơ sở hạ tầng thay đổi, ngay lập tức mọi bộ phận của kiến trúc thượng tầng thay đổi.", "KTTT có tính độc lập tương đối.", "KTTT có khả năng kìm hãm CSHT."], correctText: "Khi cơ sở hạ tầng thay đổi, ngay lập tức mọi bộ phận của kiến trúc thượng tầng thay đổi." },
        { ch: 3, question: "Cơ sở hạ tầng của Việt Nam trong thời kỳ quá độ được xác định là:", options: ["Hệ thống điện-đường-trường-trạm.", "Nền kinh tế thị trường.", "Nền kinh tế hàng hoá nhiều thành phần theo định hướng xã hội chủ nghĩa.", "Nền sản xuất công nghiệp hóa."], correctText: "Nền kinh tế hàng hoá nhiều thành phần theo định hướng xã hội chủ nghĩa." },
        { ch: 3, question: "Cấu trúc của một hình thái kinh tế - xã hội gồm:", options: ["LLSX, QHSX.", "Lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng.", "CSHT và KTTT.", "Tồn tại xã hội và ý thức xã hội."], correctText: "Lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng." },
        { ch: 3, question: "Điền từ và tác giả: \"Sự phát triển của các hình thái kinh tế - xã hội là một quá trình...\".", options: ["Lịch sử tất yếu theo quy luật / V.I. Lênin.", "Lịch sử đi lên / Ph. Ăngghen.", "Lịch sử - tự nhiên / C. Mác.", "Lịch sử của các dân tộc / Hồ Chí Minh."], correctText: "Lịch sử - tự nhiên / C. Mác." },
        { ch: 3, question: "Ba yếu tố cơ bản của hình thái kinh tế - xã hội tác động biện chứng là:", options: ["Lực lượng sản xuất, quan hệ sản xuất, kiến trúc thượng tầng.", "Tồn tại xã hội, ý thức xã hội, cơ sở hạ tầng.", "CSHT, KTTT, tồn tại xã hội.", "LLSX, QHSX, tồn tại xã hội."], correctText: "Lực lượng sản xuất, quan hệ sản xuất, kiến trúc thượng tầng." },
        { ch: 3, question: "Tính lịch sử – tự nhiên của sự phát triển các hình thái kinh tế - xã hội nghĩa là sự phát triển xã hội...", options: ["...hoàn toàn tuân theo quy luật khách quan.", "...hoàn toàn là quá trình tự nhiên.", "...tuân theo quy luật khách quan nhưng đồng thời chịu tác động của nhân tố chủ quan của con người.", "...là kết quả hoạt động chủ quan."], correctText: "...tuân theo quy luật khách quan nhưng đồng thời chịu tác động của nhân tố chủ quan của con người." },
        { ch: 3, question: "Nguồn gốc sâu xa của sự vận động và phát triển của các hình thái kinh tế - xã hội là:", options: ["Sự tăng lên của năng suất lao động.", "Áp bức và mâu thuẫn giai cấp.", "Động cơ vĩ nhân.", "Mâu thuẫn giữa lực lượng sản xuất với quan hệ sản xuất."], correctText: "Mâu thuẫn giữa lực lượng sản xuất với quan hệ sản xuất." },
        { ch: 3, question: "Lịch sử nhân loại là quá trình thay thế tuần tự của các HTKT-XH theo thứ tự:", options: ["CSNT - CHNL - Phong kiến - TBCN - XHCN.", "CSNT - Phong kiến - TBCN - XHCN - CSCN.", "Cộng sản nguyên thủy - Chiếm hữu nô lệ – Phong kiến – Tư bản chủ nghĩa – Cộng sản chủ nghĩa.", "CHNL - Phong kiến - TBCN - XHCN - CSCN."], correctText: "Cộng sản nguyên thủy - Chiếm hữu nô lệ – Phong kiến – Tư bản chủ nghĩa – Cộng sản chủ nghĩa." },
        { ch: 3, question: "Đặc điểm bao trùm của thời kỳ quá độ lên CNXH ở Việt Nam là:", options: ["LLSX lạc hậu.", "QHSX lạc hậu.", "Năng suất lao động thấp.", "Từ một nền sản xuất nhỏ bỏ qua chế độ tư bản chủ nghĩa."], correctText: "Từ một nền sản xuất nhỏ bỏ qua chế độ tư bản chủ nghĩa." },
        { ch: 3, question: "Thực chất của việc phát triển bỏ qua giai đoạn TBCN ở nước ta là:", options: ["Bỏ qua toàn bộ hệ thống kinh tế TBCN.", "Bỏ qua sự thống trị của kiến trúc thượng tầng TBCN.", "Bỏ qua LLSX, QHSX và KTTT tư bản chủ nghĩa.", "Bỏ qua các giai đoạn phát triển tuần tự."], correctText: "Bỏ qua sự thống trị của kiến trúc thượng tầng TBCN." },
        { ch: 3, question: "Xã hội đầu tiên xuất hiện giai cấp là xã hội nào?", options: ["Xã hội cộng sản nguyên thủy.", "Xã hội phong kiến.", "Xã hội chiếm hữu nô lệ.", "Xã hội tư bản."], correctText: "Xã hội chiếm hữu nô lệ." },
        { ch: 3, question: "Trong xã hội có giai cấp đối kháng, giai cấp thống trị là:", options: ["Giai cấp đông đảo nhất.", "Giai cấp trực tiếp sản xuất.", "Giai cấp nắm quyền sở hữu tư liệu sản xuất chủ yếu của xã hội.", "Tầng lớp có học vấn cao nhất."], correctText: "Giai cấp nắm quyền sở hữu tư liệu sản xuất chủ yếu của xã hội." },
        { ch: 3, question: "Nhận định nào sau đây là SAI về giai cấp?", options: ["Giai cấp cơ bản gắn với PTSX thống trị.", "Tồn tại giai cấp không cơ bản và tầng lớp trung gian.", "Giai cấp gắn với PTSX cũ là giai cấp không cơ bản.", "Trí thức là một giai cấp cơ bản trong xã hội."], correctText: "Trí thức là một giai cấp cơ bản trong xã hội." },
        { ch: 3, question: "Nguyên nhân trực tiếp quyết định sự ra đời giai cấp là:", options: ["Phân công lao động phát triển.", "Năng suất lao động cao.", "Sự xuất hiện chế độ sở hữu tư nhân về tư liệu sản xuất.", "Công cụ kim loại xuất hiện."], correctText: "Sự xuất hiện chế độ sở hữu tư nhân về tư liệu sản xuất." },
        { ch: 3, question: "Trong xã hội TBCN, giai cấp tư sản thống trị bởi vì:", options: ["Giai cấp tư sản đông đảo nhất.", "Giai cấp tư sản trực tiếp sản xuất.", "Giai cấp tư sản là giai cấp sở hữu tư liệu sản xuất chủ yếu trong xã hội.", "Giai cấp tư sản có trình độ cao."], correctText: "Giai cấp tư sản là giai cấp sở hữu tư liệu sản xuất chủ yếu trong xã hội." },
        { ch: 3, question: "Nguyên nhân khách quan của đấu tranh giai cấp là:", options: ["Do lý thuyết khoa học thúc đẩy.", "Do thủ lĩnh phát động.", "Do nghèo khổ.", "Do mâu thuẫn giữa trình độ phát triển của lực lượng sản xuất xã hội với quan hệ sản xuất đã trở nên lỗi thời."], correctText: "Do mâu thuẫn giữa trình độ phát triển của lực lượng sản xuất xã hội với quan hệ sản xuất đã trở nên lỗi thời." },
        { ch: 3, question: "Nhận định nào dưới đây là SAI về đấu tranh giai cấp ở Việt Nam?", options: ["Trong thời kỳ quá độ vẫn tồn tại đấu tranh giai cấp.", "Trong thời kỳ quá độ đi lên chủ nghĩa xã hội ở Việt Nam do không còn đối kháng giai cấp nên không còn đấu tranh giai cấp.", "Đấu tranh giai cấp diễn ra trên nhiều lĩnh vực.", "Đấu tranh kinh tế là một biểu hiện của đấu tranh giai cấp."], correctText: "Trong thời kỳ quá độ đi lên chủ nghĩa xã hội ở Việt Nam do không còn đối kháng giai cấp nên không còn đấu tranh giai cấp." },
        { ch: 3, question: "Nhận định nào dưới đây là SAI?", options: ["Giai cấp tồn tại trong mọi xã hội.", "Giai cấp là một phạm trù lịch sử.", "Giai cấp là những tập đoàn người chiếm đoạt lao động của nhau.", "Sự ra đời giai cấp không phụ thuộc ý muốn chủ quan."], correctText: "Giai cấp tồn tại trong mọi xã hội." },
        { ch: 3, question: "Trong xã hội có giai cấp, giai cấp làm cho hệ tư tưởng của nó thống trị xã hội là:", options: ["Bất cứ giai cấp nào.", "Trí thức.", "Chỉ có giai cấp nắm quyền sở hữu tư liệu sản xuất chủ yếu mới có thể làm cho hệ tư tưởng của nó trở thành hệ tư tưởng thống trị.", "Giai cấp ưu tú."], correctText: "Chỉ có giai cấp nắm quyền sở hữu tư liệu sản xuất chủ yếu mới có thể làm cho hệ tư tưởng của nó trở thành hệ tư tưởng thống trị." },
        { ch: 3, question: "Sự ra đời của nhà nước là do:", options: ["Nguyện vọng giai cấp thống trị.", "Nguyện vọng dân tộc.", "Tất yếu, khách quan, do nguyên nhân kinh tế.", "Do phát triển xã hội."], correctText: "Tất yếu, khách quan, do nguyên nhân kinh tế." },
        { ch: 3, question: "Phát biểu đúng bản chất nhà nước theo mácxít:", options: ["Công cụ quản lý vì mục đích chung.", "Công cụ quyền lực thực hiện chuyên chính giai cấp của giai cấp thống trị.", "Công cụ thực hiện chuyên chính giai cấp.", "Công cụ quyền lực của giai cấp thống trị."], correctText: "Công cụ quyền lực thực hiện chuyên chính giai cấp của giai cấp thống trị." },
        { ch: 3, question: "Nguyên nhân trực tiếp làm xuất hiện nhà nước là:", options: ["Sự thỏa thuận xã hội.", "Những mâu thuẫn giai cấp không thể điều hòa được.", "Tham vọng quyền lực.", "Lý tưởng cao đẹp."], correctText: "Những mâu thuẫn giai cấp không thể điều hòa được." },
        { ch: 3, question: "Nguyên nhân sâu xa làm xuất hiện nhà nước là:", options: ["Sự thỏa thuận xã hội.", "Sự ra đời của chế độ tư hữu.", "Mong ước của nhân dân.", "Đấu tranh giai cấp."], correctText: "Sự ra đời của chế độ tư hữu." },
        { ch: 3, question: "Nhận định nào sau đây là SAI?", options: ["Giai cấp bị trị chịu ảnh hưởng tư tưởng thống trị.", "Giai cấp thống trị không chịu ảnh hưởng tư tưởng của giai cấp bị trị.", "Giai cấp bị trị có thể có hệ tư tưởng riêng.", "Giai cấp thống trị luôn tìm cách áp đặt hệ tư tưởng."], correctText: "Giai cấp thống trị không chịu ảnh hưởng tư tưởng của giai cấp bị trị." },
        { ch: 3, question: "Điền từ: \"Nhà nước xuất hiện và tồn tại...\"", options: ["...ngay khi xã hội loài người xuất hiện.", "...trong một giai đoạn lịch sử nhất định.", "...từ trước khi có giai cấp.", "...trong mọi giai đoạn lịch sử."], correctText: "...trong một giai đoạn lịch sử nhất định." },
        { ch: 3, question: "Chức năng giai cấp của nhà nước là:", options: ["Củng cố mở rộng cơ sở chính trị xã hội.", "Tổ chức kiến tạo kết cấu giai cấp.", "Thực hiện chuyên chính, trấn áp các giai cấp đối lập.", "Thúc đẩy hình thành giai cấp mới."], correctText: "Thực hiện chuyên chính, trấn áp các giai cấp đối lập." },
        { ch: 3, question: "Căn cứ để phân loại kiểu nhà nước là:", options: ["Chức năng của nhà nước.", "Bản chất giai cấp của nhà nước.", "Nguồn gốc nhà nước.", "Cách thức tổ chức quyền lực."], correctText: "Bản chất giai cấp của nhà nước." },
        { ch: 3, question: "Nhà nước trong thời kỳ quá độ lên CNXH là:", options: ["Nhà nước dân chủ cộng hòa.", "Nhà nước dân chủ tư sản.", "Cộng hoà đại nghị.", "Nhà nước dân chủ nhân dân."], correctText: "Nhà nước dân chủ nhân dân." },
        { ch: 3, question: "Xu hướng phát triển của nhà nước trong chủ nghĩa cộng sản là:", options: ["Củng cố quyền lực giai cấp.", "Chuyển hóa thành nhà nước cộng sản.", "Chuyển hóa thành nhà nước toàn cầu.", "Nhà nước tự tiêu vong."], correctText: "Nhà nước tự tiêu vong." },
        { ch: 3, question: "Lật đổ một chế độ chính trị lỗi thời và thiết lập chế độ tiến bộ hơn gọi là:", options: ["Đảo chính.", "Cách mạng xã hội.", "Bạo loạn.", "Cách mạng văn hóa."], correctText: "Cách mạng xã hội." },
        { ch: 3, question: "Cộng đồng người ổn định hình thành trong lịch sử trên một lãnh thổ, có chung kinh tế, ngôn ngữ, văn hóa gọi là:", options: ["Bộ lạc.", "Dân tộc.", "Quốc gia.", "Bộ tộc."], correctText: "Dân tộc." },
        { ch: 3, question: "Tồn tại xã hội bao gồm những yếu tố nào sau đây?", options: ["Phương thức sản xuất và điều kiện tự nhiên.", "Phương thức sản xuất, điều kiện tự nhiên - hoàn cảnh địa lý, và dân cư.", "Phương thức sản xuất, xã hội và dân cư.", "Điều kiện tự nhiên và dân cư."], correctText: "Phương thức sản xuất, điều kiện tự nhiên - hoàn cảnh địa lý, và dân cư." },
        { ch: 3, question: "Khái niệm ý thức xã hội dùng để chỉ:", options: ["Phương diện sinh hoạt vật chất.", "Phương diện tinh thần của một giai cấp.", "Phương diện sinh hoạt tinh thần của đời sống xã hội, nảy sinh từ tồn tại xã hội và phản ánh tồn tại xã hội.", "Đặc trưng tâm lý dân tộc."], correctText: "Phương diện sinh hoạt tinh thần của đời sống xã hội, nảy sinh từ tồn tại xã hội và phản ánh tồn tại xã hội." },
        { ch: 3, question: "Mối quan hệ giữa ý thức xã hội và ý thức cá nhân là biểu thị mối quan hệ giữa:", options: ["Nội dung và hình thức.", "Cái chung và cái riêng.", "Bản chất và hiện tượng.", "Cái chung và cái đơn nhất."], correctText: "Cái chung và cái riêng." },
        { ch: 3, question: "Đặc điểm của hệ tư tưởng:", options: ["Ra đời trực tiếp từ tâm lý xã hội.", "Hệ thống những quan điểm, hệ thống hoá, khái quát hóa thành lý luận, thành các học thuyết chính trị - xã hội phản ánh lợi ích của một giai cấp nhất định.", "Chỉ có hệ tư tưởng biểu hiện tính giai cấp.", "Không ảnh hưởng đến khoa học."], correctText: "Hệ thống những quan điểm, hệ thống hoá, khái quát hóa thành lý luận, thành các học thuyết chính trị - xã hội phản ánh lợi ích của một giai cấp nhất định." },
        { ch: 3, question: "Lựa chọn phương án đúng về vai trò của tồn tại xã hội:", options: ["Ý thức phụ thuộc thụ động.", "Tồn tại xã hội quyết định ý thức xã hội.", "Ý thức biến đổi ngay cùng tồn tại xã hội.", "Quyết định không qua trung gian."], correctText: "Tồn tại xã hội quyết định ý thức xã hội." },
        { ch: 3, question: "Nhận định nào sau đây là đúng?", options: ["Không phải ý thức quyết định đời sống mà chính đời sống quyết định ý thức.", "Chính ý thức quyết định đời sống.", "Đời sống không quyết định ý thức.", "Đời sống và ý thức tồn tại độc lập."], correctText: "Không phải ý thức quyết định đời sống mà chính đời sống quyết định ý thức." },
        { ch: 3, question: "Lựa chọn phương án đúng về tính độc lập tương đối của ý thức xã hội:", options: ["Tư tưởng khoa học vượt trước có thể thoát ly tồn tại xã hội.", "Tồn tại xã hội thay đổi nhưng có một số bộ phận của ý thức xã hội chưa thay đổi ngay cùng tồn tại xã hội.", "Các hình thái ý thức không tác động qua lại.", "Tính kế thừa không gắn với tính giai cấp."], correctText: "Tồn tại xã hội thay đổi nhưng có một số bộ phận của ý thức xã hội chưa thay đổi ngay cùng tồn tại xã hội." },
        { ch: 3, question: "Ý thức xã hội gồm các hình thái ý thức xã hội cơ bản nào?", options: ["Chính trị, pháp quyền, đạo đức, văn hóa, tôn giáo, khoa học, triết học.", "Ý thức chính trị, ý thức pháp quyền, ý thức đạo đức, ý thức thẩm mỹ, ý thức tôn giáo, ý thức khoa học, ý thức triết học.", "Chính trị, pháp quyền, đạo đức, dân tộc, tôn giáo, khoa học, triết học.", "Chính trị, pháp quyền, văn hóa, môi trường..."], correctText: "Ý thức chính trị, ý thức pháp quyền, ý thức đạo đức, ý thức thẩm mỹ, ý thức tôn giáo, ý thức khoa học, ý thức triết học." },
        { ch: 3, question: "Xét đến cùng nhân tố quyết định sự thắng lợi của một chế độ xã hội mới là:", options: ["Sức mạnh nhà nước.", "Sức mạnh pháp luật.", "Năng suất lao động xã hội.", "Hiệu quả hệ thống chính trị."], correctText: "Năng suất lao động xã hội." },
        { ch: 3, question: "Hình thái ý thức xã hội nào ra đời ngay trong xã hội cộng sản nguyên thủy:", options: ["Ý thức triết học.", "Ý thức thẩm mỹ.", "Ý thức chính trị.", "Ý thức giai cấp."], correctText: "Ý thức thẩm mỹ." },
        { ch: 3, question: "Triết học Mác coi giới tự nhiên là... của con người:", options: ["...đối tượng chinh phục.", "...đối tượng cải tạo.", "...thân thể vô cơ.", "...đối tượng vô cơ."], correctText: "...thân thể vô cơ." },
        { ch: 3, question: "Nội dung thể hiện đúng quan điểm về con người:", options: ["Con người là sản phẩm thụ động.", "Con người vừa là chủ thể của lịch sử, vừa là sản phẩm của lịch sử.", "Con người sáng tạo lịch sử theo ý muốn chủ quan.", "Con người là bộ phận của lịch sử."], correctText: "Con người vừa là chủ thể của lịch sử, vừa là sản phẩm của lịch sử." },
        { ch: 3, question: "Điền từ: \"Trong ...(1)... của nó bản chất con người là ...(2)... những quan hệ xã hội.\"", options: ["1) tính vật chất, 2) tổng hòa.", "1) tính vật chất, 2) tổng hợp.", "1) tính hiện thực, 2) tổng số.", "1) tính hiện thực, 2) tổng hòa."], correctText: "1) tính hiện thực, 2) tổng hòa." },
        { ch: 3, question: "Xuất phát điểm nghiên cứu duy vật lịch sử của C. Mác là:", options: ["Con người cụ thể.", "Con người trừu tượng.", "Con người hiện thực.", "Con người lý tưởng."], correctText: "Con người hiện thực." },
        { ch: 3, question: "Cống hiến quan trọng nhất của triết học Mác về bản chất con người là:", options: ["Chỉ ra con người là chủ thể sáng tạo lịch sử.", "Chỉ ra cái sinh học và cái xã hội.", "Chỉ ra vai trò của các quan hệ xã hội trong việc hình thành bản chất con người.", "Chỉ ra sự tiến hóa từ tự nhiên."], correctText: "Chỉ ra vai trò của các quan hệ xã hội trong việc hình thành bản chất con người." },
        { ch: 3, question: "Nội dung KHÔNG thể hiện đúng quan điểm về sự tha hóa con người:", options: ["Tha hoá con người là phạm trù vĩnh viễn.", "Tha hoá con người là hiện tượng mang tính lịch sử.", "Tha hoá không chỉ tồn tại trong lĩnh vực đạo đức.", "Tha hoá phát triển cao độ trong TBCN."], correctText: "Tha hoá con người là phạm trù vĩnh viễn." },
        { ch: 3, question: "Theo quan điểm của triết học Mác - Lênin, lịch sử được quyết định bởi:", options: ["Quần chúng nhân dân.", "Mệnh trời.", "Cá nhân hào kiệt.", "Các quy luật tự nhiên."], correctText: "Quần chúng nhân dân." }
    ];

    let currentQuestions = [];
    let currentQuiz = 0;
    let score = 0;

    // Hàm xáo trộn mảng ngẫu nhiên (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startQuiz() {
        const ch1Checked = document.getElementById('ch1').checked;
        const ch2Checked = document.getElementById('ch2').checked;
        const ch3Checked = document.getElementById('ch3').checked;

        if (!ch1Checked && !ch2Checked && !ch3Checked) {
            alert('Vui lòng chọn ít nhất một chương để bắt đầu!');
            return;
        }

        let selectedRaw = rawQuestions.filter(q => {
            if (q.ch === 1 && ch1Checked) return true;
            if (q.ch === 2 && ch2Checked) return true;
            if (q.ch === 3 && ch3Checked) return true;
            return false;
        });

        // 1. Xáo trộn thứ tự các câu hỏi
        let shuffledQuestions = shuffleArray(selectedRaw);

        // 2. Xáo trộn đáp án trong mỗi câu hỏi & cập nhật lại vị trí đáp án đúng
        currentQuestions = shuffledQuestions.map((q, idx) => {
            const shuffledOptions = shuffleArray(q.options);
            const correctIdx = shuffledOptions.findIndex(opt => opt === q.correctText);
            
            // Gán nhãn a, b, c, d lại cho các lựa chọn
            const prefixes = ["a. ", "b. ", "c. ", "d. "];
            const finalOptions = shuffledOptions.map((opt, i) => prefixes[i] + opt);

            return {
                question: `Câu ${idx + 1}: ${q.question}`,
                options: finalOptions,
                correct: correctIdx
            };
        });

        currentQuiz = 0;
        score = 0;
        
        // Cập nhật giao diện
        document.getElementById('quiz-body').innerHTML = `
            <div class="progress" id="progress"></div>
            <div class="question" id="question"></div>
            <div id="options-container"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()" style="display:none;">Câu tiếp theo</button>
            <div class="clear"></div>
        `;

        loadQuiz();
    }

    function loadQuiz() {
        if (currentQuestions.length === 0) return;
        const currentData = currentQuestions[currentQuiz];
        document.getElementById('progress').innerText = `Câu ${currentQuiz + 1} / ${currentQuestions.length}`;
        document.getElementById('question').innerText = currentData.question;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';

        currentData.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.classList.add('option-btn');
            button.innerText = option;
            button.onclick = () => selectOption(button, index, currentData.correct);
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(button, selectedIndex, correctIndex) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            button.classList.add('correct');
            score++;
        } else {
            button.classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuiz++;
        if (currentQuiz < currentQuestions.length) {
            loadQuiz();
        } else {
            document.getElementById('quiz-body').innerHTML = `
                <h2 style="text-align: center; color: #27ae60;">Bạn đã hoàn thành bài luyện tập!</h2>
                <p style="text-align: center; font-size: 18px;">Kết quả: <strong>${score} / ${currentQuestions.length}</strong> câu đúng.</p>
                <button class="next-btn" style="float: none; display: block; margin: 20px auto;" onclick="startQuiz()">Làm lại bài mới (Đảo câu mới)</button>
            `;
        }
    }

    // Tự động khởi chạy lần đầu với tất cả các chương
    startQuiz();
</script>
